name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  dsp-tests-linux:
    name: DSP library and tests (Linux, no JUCE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DJANE60_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sim-reference:
    name: Reference simulation (ngspice) vs plugin blocks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice and numpy
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ngspice python3-numpy
          ngspice --version | head -2
      - name: Build the block dump tool
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DJANE60_BUILD_PLUGIN=OFF -DJANE60_BUILD_TESTS=OFF
          cmake --build build --target jane60_ir3109_dump
      - name: Run the reference and the plugin block
        run: |
          mkdir -p sim/ref sim/dsp
          python3 tools/sim/ir3109_ref.py --diag --out sim/ref
          python3 tools/sim/ir3109_ref.py --out sim/ref
          ./build/tools/jane60_ir3109_dump calibration/juno60.json sim/dsp
          for f in sim/ref/*.csv sim/dsp/*.csv; do echo "== $f"; cat "$f"; done
      - name: Compare
        run: python3 tools/sim/compare.py --ref sim/ref --dsp sim/dsp --out sim/ir3109-report.md
      - uses: actions/upload-artifact@v7
        with:
          name: sim-reference-report
          path: sim/
          retention-days: 30

  plugin-macos:
    name: Plugin (macOS universal, AU + VST3 + Standalone)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Locate artefacts
        id: art
        run: |
          echo "au=$(find build -name 'Jane-Sixty.component' -type d | head -1)" >> "$GITHUB_OUTPUT"
          echo "vst3=$(find build -name 'Jane-Sixty.vst3' -type d | head -1)" >> "$GITHUB_OUTPUT"
          echo "app=$(find build -name 'Jane-Sixty.app' -type d | head -1)" >> "$GITHUB_OUTPUT"
      - name: Check the app icon
        run: |
          for b in "${{ steps.art.outputs.app }}" "${{ steps.art.outputs.au }}" "${{ steps.art.outputs.vst3 }}"; do
            icns=$(ls "$b"/Contents/Resources/*.icns 2>/dev/null | head -1)
            test -s "$icns" || { echo "no .icns in $b/Contents/Resources"; ls "$b/Contents/Resources"; exit 1; }
            grep -q "$(basename "$icns" .icns)" "$b/Contents/Info.plist" || { echo "Info.plist in $b does not name $icns"; exit 1; }
          done
          icns=$(ls "${{ steps.art.outputs.app }}"/Contents/Resources/*.icns | head -1)
          iconutil -c iconset -o icons.iconset "$icns" && ls icons.iconset
      - name: Ad-hoc sign bundles
        run: |
          for b in "${{ steps.art.outputs.au }}" "${{ steps.art.outputs.vst3 }}" "${{ steps.art.outputs.app }}"; do
            chmod -R u+rwX "$b"
            find "$b/Contents/MacOS" -type f -exec chmod +x {} +
            codesign --force --deep --options runtime --timestamp=none -s - "$b"
            codesign --verify --deep --strict "$b"
          done
      - name: Install AU for validation
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "${{ steps.art.outputs.au }}" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
      - name: auval
        run: auval -strict -v aumu Jn60 Clvg
      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests --validate "${{ steps.art.outputs.vst3 }}"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests --validate "${{ steps.art.outputs.au }}"
      - name: Package artefacts
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "${{ steps.art.outputs.au }}" dist/Jane-Sixty-AU.zip
          ditto -c -k --keepParent "${{ steps.art.outputs.vst3 }}" dist/Jane-Sixty-VST3.zip
          ditto -c -k --keepParent "${{ steps.art.outputs.app }}" dist/Jane-Sixty-Standalone.zip
      - uses: actions/upload-artifact@v7
        with:
          name: jane60-macos-unsigned
          path: dist/*.zip
          retention-days: 14

  plugin-windows:
    name: Plugin (Windows x64, VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4
      - name: Unit tests
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure
      - name: Locate artefacts
        id: art
        shell: pwsh
        run: |
          $dll  = Get-ChildItem -Path build -Recurse -File -Filter 'Jane-Sixty.vst3' | Where-Object { $_.FullName -like '*\Contents\x86_64-win\*' } | Select-Object -First 1
          if ($null -eq $dll) { throw "VST3 dll not found under build (JUCE writes an empty bundle folder per configuration, so a folder match is not enough)" }
          $vst3 = $dll.Directory.Parent.Parent.FullName
          $exe  = (Get-ChildItem -Path build -Recurse -File -Filter 'Jane-Sixty.exe' | Where-Object { $_.FullName -like '*\Standalone\*' } | Select-Object -First 1).FullName
          if (-not $exe) { throw "Standalone exe not found under build" }
          "vst3=$vst3" >> $env:GITHUB_OUTPUT
          "exe=$exe"   >> $env:GITHUB_OUTPUT
          Write-Host "VST3: $vst3"; Write-Host "Standalone: $exe"
      - name: Check the exe icon
        shell: pwsh
        run: |
          $exe = "${{ steps.art.outputs.exe }}"
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw "no icon resource in $exe" }
          Write-Host "icon $($icon.Width)x$($icon.Height) in $exe"
          if (-not (Test-Path (Get-ChildItem -Path build -Recurse -File -Filter 'icon.ico' | Select-Object -First 1).FullName)) { throw "JUCE did not generate icon.ico" }
      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          & .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests --validate "${{ steps.art.outputs.vst3 }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package artefacts
        shell: pwsh
        run: |
          $vst3 = "${{ steps.art.outputs.vst3 }}"
          $exe = "${{ steps.art.outputs.exe }}"
          New-Item -ItemType Directory -Force -Path dist-src, dist | Out-Null
          robocopy "$vst3" "dist-src\Jane-Sixty.vst3" /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0   # robocopy's 1 means "files copied"; the runner would fail the step on it
          Copy-Item $exe dist-src/
          if (-not (Test-Path "dist-src\Jane-Sixty.vst3\Contents\x86_64-win\Jane-Sixty.vst3")) { throw "the VST3 bundle copy lost its dll" }
          Compress-Archive -Path dist-src/Jane-Sixty.vst3 -DestinationPath dist/Jane-Sixty-VST3-win64.zip
          Compress-Archive -Path dist-src/Jane-Sixty.exe -DestinationPath dist/Jane-Sixty-Standalone-win64.zip
          foreach ($f in Get-ChildItem dist) { if ($f.Length -lt 1MB) { throw "$($f.Name) is only $($f.Length) bytes" } }
      - uses: actions/upload-artifact@v7
        with:
          name: jane60-windows-unsigned
          path: dist/*.zip
          retention-days: 14
